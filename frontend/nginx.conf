server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/students {
        proxy_pass http://backend:8000/api/v1/students/;
    }

    location ^~ /api/students/ {
        rewrite ^/api/students/(.*)$ /api/v1/students/$1 break;
        proxy_pass http://backend:8000;
    }

    location = /api/classes {
        proxy_pass http://backend:8000/api/v1/classes/;
    }

    location = /api/teachers {
        proxy_pass http://backend:8000/api/v1/teachers/;
    }

    location = /api/grades {
        proxy_pass http://backend:8000/api/v1/grades/;
    }

    location = /api/attendance {
        proxy_pass http://backend:8000/api/v1/attendance/;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
